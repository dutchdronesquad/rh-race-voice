---
name: Linting

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DEFAULT_PYTHON: "3.13"

jobs:
  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell scripts
        run: shellcheck tools/install-sendspin-service.sh tools/test-sendspin-installer.sh

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🏗 Set up UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true
      - name: 🏗 Install project dependencies
        run: uv sync --all-extras --dev
      - name: 🚀 Run ruff linter
        run: uv run ruff check --output-format=github .
      - name: 🚀 Run ruff formatter
        run: uv run ruff format --check .

  prek-hooks:
    name: Prek hooks
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🏗 Set up UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true
      - name: 🏗 Install project dependencies
        run: uv sync --all-extras --dev
      - name: 🚀 Check Python AST
        run: uv run prek run check-ast --all-files
      - name: 🚀 Check for case conflicts
        run: uv run prek run check-case-conflict --all-files
      - name: 🚀 Check docstring is first
        run: uv run prek run check-docstring-first --all-files
      - name: 🚀 Detect Private Keys
        run: uv run prek run detect-private-key --all-files
      - name: 🚀 Check End of Files
        run: uv run prek run end-of-file-fixer --all-files
      - name: 🚀 Trim Trailing Whitespace
        run: uv run prek run trailing-whitespace --all-files

  player:
    name: Player build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sendspin_player
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🏗 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: sendspin_player/package-lock.json
      - name: 🏗 Install player dependencies
        run: npm ci
      - name: 🚀 Lint player with Oxlint
        run: npm run lint
      - name: 🚀 Build player
        run: npm run build:plugin
