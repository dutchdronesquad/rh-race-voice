---
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-player:
    name: Build player assets
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: 🏗 Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: sendspin_player/package-lock.json
      - name: 🏗 Install player dependencies
        run: npm ci
        working-directory: sendspin_player
      - name: 🚀 Build player
        run: npm run build:plugin
        working-directory: sendspin_player
      - name: 📦 Package plugin
        run: zip -r race_voice.zip custom_plugins
      - name: ⬆️ Upload plugin artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-plugin
          path: race_voice.zip
          if-no-files-found: error

  build-deb:
    name: Build ${{ matrix.arch }} .deb
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: 🏗 Build .deb
        uses: ./.github/actions/build-sendspin-deb
        with:
          arch: ${{ matrix.arch }}
          version: ${{ github.event.release.tag_name }}
      - name: 🧾 Write checksum
        run: |
          for deb in dist/sendspin-service_*_${{ matrix.arch }}.deb; do
            sha256sum "$deb" > "$deb.sha256"
          done
      - name: ⬆️ Upload package artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-deb-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/sendspin-service_*.deb
            dist/sendspin-service_*.deb.sha256

  publish:
    name: Publish release assets and Docker image
    needs: [build-player, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: ⤵️ Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: 🧾 Verify release assets
        run: |
          test -s dist/race_voice.zip
          for arch in amd64 arm64; do
            sha256sum --check "dist/sendspin-service_"*"_${arch}.deb.sha256"
          done
          test -s tools/install-sendspin-service.sh
      - name: 🏗 Build and publish Docker image
        uses: ./.github/actions/build-sendspin-docker
        with:
          platforms: linux/amd64,linux/arm64
          push: "true"
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - name: ⬆️ Upload release assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          fail_on_unmatched_files: true
          files: |
            dist/race_voice.zip
            dist/sendspin-service_*.deb
            dist/sendspin-service_*.deb.sha256
            tools/install-sendspin-service.sh
